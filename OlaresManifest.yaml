olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  wings: 1

metadata:
  name: wings
  appid: wings
  icon: https://raw.githubusercontent.com/bayerhazard/wings-for-hermes/main/icon.png
  title: Wings for Hermes
  version: '26.08.3'
  categories:
    - AI
  description: AI Agent Web UI for Hermes — chat, sessions, memory, skills, cron
  fullDescription: >
    **Wings for Hermes** — AI Agent Web UI, forked from hermes-webui.

    **Full feature parity with Hermes Web UI:**
    - Chat with streaming, reasoning display, tool-call cards, approvals
    - Sessions: create, resume, search, pin, archive, projects, export
    - Memory: view and edit MEMORY.md / USER.md inline
    - Skills: list, preview, create, edit, delete (106+ skills)
    - Tasks: cron jobs — view, create, edit, run, pause/resume, run history
    - Profiles, workspaces with file browser, todos, themes

    **Shared-state architecture**
    Runs as a second, additive agent instance on the *same* HERMES_HOME as your existing Hermes Agent app. Sessions, memory, auth, and config are shared. The agent source is copied from the exact running gateway image at pod start, so the WebUI always runs version-matched code.

    **Auto-detection**
    On startup, the app automatically finds your Hermes Agent home directory — no manual path configuration needed. UID/GID is auto-detected from the hermesagent directory ownership.

    **Access**
    Protected by Olares SSO (internal). Set an additional app password in the app settings for defense in depth.

    **Requirements**
    - Requires the Hermes Agent app (hermesagent) installed for the same Olares user.
    - Upstream project: https://github.com/nesquena/hermes-webui (MIT)
  upgradeDescription: "v26.08.3: Conversational voice — Streaming-TTS (/api/tts/stream, Satz-für-Satz-Synthese + progressives Browser-Playback), Barge-in-Unterbrechungserkennung (Full-Duplex, auch während der Generation), TTS-Timeout konfigurierbar (HERMES_WEBUI_TTS_TIMEOUT), Agent-Source auf v2026.8.3. Built for Olares 1.12.6. v26.08.2: Server-STT fix — Diktat wird jetzt als 16-bit PCM WAV aufgenommen (Web Audio API statt MediaRecorder/WebM), da das vLLM-ASR-Backend WebM/Opus nicht dekodieren kann. v26.08.1: Unified naming — category AI, English descriptions. Built for Olares 1.12.6. v1.9.22: OpenAI-TTS SSRF-Allowlist — HERMES_WEBUI_TTS_TRUSTED_HOSTS erlaubt explizit getraute Hosts (z.B. internes LiteLLM llm.aimighty.olares.de) trotz privater IP. v1.9.21: OpenAI-TTS fix — Server fällt für den API-Key auf tts.openai.api_key aus der geteilten config.yaml zurück (bisher nur Env/.env -> 503). v1.9.20: client-side VAD auto-stop; v1.9.17: OlaresManifest v3 metadata-Struktur vervollständigt (fullDescription/upgradeDescription/developer etc. wie rewind); v1.9.16: Chart-Bereinigung — verschachtelte Helm-tgz entfernt; v1.9.15: Composer-Placeholder-Fix (kein Message-Wings-Flash); v1.9.13: AImighty-Rebrand (Geist-Fonts, Hanseatenblau/Gold-Theme)."
  developer: Aimighty
  website: https://github.com/bayerhazard/wings-for-hermes
  sourceCode: https://github.com/bayerhazard/wings-for-hermes
  locale:
    - en-US
  supportArch:
    - amd64

