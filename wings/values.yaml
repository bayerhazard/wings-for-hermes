image:
  repository: ghcr.io/bayerhazard/wings-for-hermes
  tag: "26.08.8"
  pullPolicy: Always
agentImage:
  repository: beclab/harveyff-hermes-agent
  tag: "v2026.8.3-uid1000"
  pullPolicy: IfNotPresent
workloads:
  wings:
    replicaCount: 1
webuiPort: 8787
resources:
  limits:
    cpu: "4"
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 512Mi
env:
  HERMES_WEBUI_HOST: "0.0.0.0"
  HERMES_WEBUI_PORT: "8787"
  HERMES_WEBUI_SSE_CHUNKED: "1"
  HERMES_WEBUI_AGENT_DIR: "/home/hermeswebui/.hermes/hermes-agent"
  HERMES_WEBUI_AUTO_INSTALL: "1"
  HERMES_WEBUI_TTS_TIMEOUT: "300"
  WANTED_UID: "1000"
  WANTED_GID: "1000"
  TZ: Etc/UTC
olaresEnv:
  HERMES_WEBUI_PASSWORD: ""
  HERMES_WEBUI_DEFAULT_MODEL: ""
  HERMES_WEBUI_TTS_TRUSTED_HOSTS: "llm.aimighty.olares.de"
startupProbe:
  httpGet:
    path: /health
    port: 8787
  failureThreshold: 60
  periodSeconds: 10
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /health
    port: 8787
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
service:
  type: ClusterIP
