olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  wings: 1

metadata:
  name: wings
  appid: wings
  icon: https://raw.githubusercontent.com/bayerhazard/wings-for-hermes/main/icon.png
  title: Wings for Hermes
  version: 26.9.5
  categories:
    - AI
  description: AI Agent Web UI for Hermes — chat, sessions, memory, skills, cron
  fullDescription: >
    **Wings for Hermes** — AI Agent Web UI, forked from hermes-webui.

    **Full feature parity with Hermes Web UI:**
    - Chat with streaming, reasoning display, tool-call cards, approvals
    - Sessions: create, resume, search, pin, archive, projects, export
    - Memory: view and edit MEMORY.md / USER.md inline
    - Skills: list, preview, create, edit, delete (106+ skills)
    - Tasks: cron jobs — view, create, edit, run, pause/resume, run history
    - Profiles, workspaces with file browser, todos, themes

    **Shared-state architecture**
    Runs as a second, additive agent instance on the *same* HERMES_HOME as your existing Hermes Agent app. Sessions, memory, auth, and config are shared. The agent source is copied from the exact running gateway image at pod start, so the WebUI always runs version-matched code.

    **Auto-detection**
    On startup, the app automatically finds your Hermes Agent home directory — no manual path configuration needed. UID/GID is auto-detected from the hermesagent directory ownership.

    **Access**
    Protected by Olares SSO (internal). Set an additional app password in the app settings for defense in depth.

    **Requirements**
    - Requires the Hermes Agent app (hermesagent) installed for the same Olares user.
    - Upstream project: https://github.com/nesquena/hermes-webui (MIT)
  upgradeDescription: "v26.9.5: Project folders in the sidebar now follow the Beacon navigation language — a single 40pt row per folder with a leading icon, a muted session count and the gold active state, and one tap opens or closes it (iOS never fired the old double-click). On phones the nav bar and the input field take the sidebar tone, so they read as chrome against the chat canvas. Built for Olares 1.12.6. v26.9.4: Mobile-native PWA for the iPhone — a slim nav bar (menu, centred title, new chat), edge-to-edge safe-area handling for Dynamic Island and home indicator, a composer with the context ring inside the model pill, and 44pt touch targets. Adds finger-following edge swipe, swipe-to-close, long-press message actions and iOS launch images. Built for Olares 1.12.6. v26.9.3: Dark-mode surfaces rebalanced — the sidebar now carries the lighter Hanseatenblau (former input-field tone) while the entire right side, including the composer field, sits on one uniform dark; the new-chat plus moved to the footer module row as its leftmost icon. Built for Olares 1.12.6. v26.9.2: Relay design port for Basic mode — AImighty wordmark header, 220px sidebar, Relay color tokens (light and dark), search and module-icon footer rows; the sidebar gauge pill dissolves into the composer as a centered status cluster (context ring, model chip, token readout) with new-chat on the action side. Built for Olares 1.12.6. v26.9.1: Upstream-sync round 4 (anchor merge to hermes-webui exp-v0.52.264) — structural maintenance release, no functional change: the voice backend moved to api/wings_voice.py and Wings-only CSS to static/wings.css so future upstream merges stay mechanical; repo hygiene (node_modules and orphaned root JS removed from Git). Built for Olares 1.12.6. v26.08.13: TTS voice pin — the deployment now pins the TTS voice via HERMES_WEBUI_TTS_VOICE (default 'clone:new', the registered OmniVoice voice clone), so Wings speaks with the intended cloned voice instead of the OpenAI default 'alloy'. Built for Olares 1.12.6. v26.08.12: Server-STT fix — the dictation endpoint now pins the OpenAI-compatible STT model via HERMES_WEBUI_STT_MODEL (default 'stt', the LiteLLM gateway ASR model), so mic dictation works against the local qwen3-asr backend instead of the default whisper-1 (which the gateway key rejects). Built for Olares 1.12.6. v26.08.11: Chart-Fix (upgradeDescription-Quote) — Funktionsumfang identisch zu v26.08.9/v26.08.10 (Upstream-Sync Runde 3 + Agent 0.20.5). Built for Olares 1.12.6. v26.08.10: Market-Sync-Rekickv26.08.11: Market-Sync-Rekick — identischer Funktionsumfang wie 26.08.9 (Upstream-Sync Runde 3 + Agent 0.20.5); Versionssprung zur Aufloesung eines Hash-Deadlocks im Market-Backend. Built for Olares 1.12.6. v26.08.9: Upstream-Sync Runde 3 (hermes-webui bis 24.08.) — Security: Approval-request_id-Matching (#7093), kein Double-Respond nach end_headers, OS-Drop-Snapshot (#7142). Kernfixes: User-Timestamps bleiben erhalten (#6935), SSE Last-Event-ID-Resumption (#6886), Cross-Session-Render-Leak (#6502), Phantom-Compression-Barrier (#6572), Theme-Boot-Fabrication (#6808), Settings-Autosave-Isolation (#6666/#6856), SILENT-Control-Turns (#7018), Titel-Sync zu state.db (#6892/#6964), Scroll-Bounce-Fade (#6257), Worklog-Leerframe (#6473). Agent-Image auf v2026.8.19 (=0.20.5). Built for Olares 1.12.6. v26.08.8: AImighty-Designguide umgesetzt — Theme “AImighty” entfernt (identisch zu Dunkel, als `.dark` zusammengefuehrt), Ordner-Drag&Drop-Reihenfolge (persistiert, Unassigned oben), Ordner-Doppelklick-Seed einmalig, Sessions im Ordner 4px eingerueckt, Mikro-Status 12px ausgerichtet, Favicon hart erneuert (neue Dateinamen), Startbildschirm-Logo als Wortmarke (Gold/Blau, je Grund getauscht). Built for Olares 1.12.6. v26.08.7: Sidebar-Ordner + Sprachmodus-Fixes — Ordner je Projekt genau einmal (korrigiert), Pfeile/Farbpunkte entfernt (nur Ordnername, Doppelklick klappt aus/ein), Farben getauscht (Ordner weiss/Sessions blaeulich), Sessions im Ordner eingerueckt, Standard: alles eingeklappt außer Unassigned (oben, offen). Zuhör-Animation in Akzentfarbe, Denk-Animation 180° gedreht und halbiert. Built for Olares 1.12.6. v26.08.6: Session-Verwaltung + UI-Fixes — Drag&Drop-Umsortierung (persistiert), Ordner-Hierarchie in der Sidebar, ‘Auswählen’ ins Kontextmenü, Synthwave-Denk-Animation, korrigiertes App-Favicon, Sidebar-Breite 270px, Lösch-Dialog-Dunkelmodus-Fix, doppeltes Plus entfernt. Built for Olares 1.12.6. v26.08.3: Conversational voice — Streaming-TTS (/api/tts/stream, Satz-für-Satz-Synthese + progressives Browser-Playback), Barge-in-Unterbrechungserkennung (Full-Duplex, auch während der Generation), TTS-Timeout konfigurierbar (HERMES_WEBUI_TTS_TIMEOUT), Agent-Source auf v2026.8.3. Built for Olares 1.12.6. v26.08.2: Server-STT fix — Diktat wird jetzt als 16-bit PCM WAV aufgenommen (Web Audio API statt MediaRecorder/WebM), da das vLLM-ASR-Backend WebM/Opus nicht dekodieren kann. Built for Olares 1.12.6. v26.08.1: Unified naming — category AI, English descriptions. Built for Olares 1.12.6. v1.9.22: OpenAI-TTS SSRF-Allowlist — HERMES_WEBUI_TTS_TRUSTED_HOSTS erlaubt explizit getraute Hosts (z.B. internes LiteLLM llm.aimighty.olares.de) trotz privater IP. v1.9.21: OpenAI-TTS fix — Server fällt für den API-Key auf tts.openai.api_key aus der geteilten config.yaml zurück (bisher nur Env/.env -> 503). v1.9.20: client-side VAD auto-stop; v1.9.17: OlaresManifest v3 metadata-Struktur vervollständigt (fullDescription/upgradeDescription/developer etc. wie rewind); v1.9.16: Chart-Bereinigung — verschachtelte Helm-tgz entfernt; v1.9.15: Composer-Placeholder-Fix (kein Message-Wings-Flash); v1.9.13: AImighty-Rebrand (Geist-Fonts, Hanseatenblau/Gold-Theme)."
  developer: Aimighty
  website: https://github.com/bayerhazard/wings-for-hermes
  sourceCode: https://github.com/bayerhazard/wings-for-hermes
  locale:
    - en-US
  supportArch:
    - amd64

